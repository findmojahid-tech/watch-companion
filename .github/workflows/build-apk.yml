name: Build Android APK

on:
  push:
    branches: [ main, "build/**", "integration/momo-final" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prevent unreviewed watch firmware writes
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -nE 'writeCharacteristic[[:space:]]*\\(|writeDescriptor[[:space:]]*\\(' app/src/main/java; then
            echo "Unreviewed BLE write API detected. Stop: firmware safety gate failed."
            exit 1
          fi

      - name: Verify low-RAM Momo watch-face renderer
        shell: bash
        run: |
          set -euo pipefail
          gcc -std=c11 -Wall -Wextra -Werror -pedantic \
            watch-firmware/momo_face_renderer.c \
            watch-firmware/tests/test_momo_face.c \
            -o /tmp/momo_face_test
          /tmp/momo_face_test

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android 35 SDK
        shell: bash
        run: |
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Validate task behavior and persistence
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WatchCompanion-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
