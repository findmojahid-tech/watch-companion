name: Build Android APK

on:
  push:
    branches: [ main, "build/**", "integration/momo-final" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Block watch firmware/data writes; allow controlled CCCD subscriptions
        shell: bash
        run: |
          set -euo pipefail
          # Never allow vendor characteristic writes, including OTA/DFU uploads.
          if grep -R -nE 'writeCharacteristic[[:space:]]*\\(' app/src/main/java; then
            echo "Proprietary BLE characteristic writer detected. Stop."
            exit 1
          fi
          # The only allowed descriptor writes are Android notification CCCD
          # subscriptions in DirectWatchClient, which runtime-checks the
          # actual Watch 7 4.21 GATT signature and a fixed allowlist.
          unsafe=$(grep -R -nE 'writeDescriptor[[:space:]]*\\(' app/src/main/java \\
            | grep -v 'DirectWatchClient.kt:' || true)
          if [ -n "$unsafe" ]; then
            echo "$unsafe"
            echo "Unexpected descriptor writer detected. Stop."
            exit 1
          fi
          file=app/src/main/java/com/mojahid/watchcompanion/DirectWatchClient.kt
          count=$(grep -cE 'writeDescriptor[[:space:]]*\\(' "$file" || true)
          if [ "$count" -ne 2 ]; then
            echo "Unexpected number of CCCD write sites: $count"
            exit 1
          fi
          grep -q 'Watch7PassiveProbe.canSubscribe' "$file"
          grep -q '00002902-0000-1000-8000-00805f9b34fb' "$file"
          grep -q 'BluetoothGattDescriptor.ENABLE_NOTIFICATION_VALUE' "$file"

      - name: Verify low-RAM Momo watch-face renderer
        shell: bash
        run: |
          set -euo pipefail
          gcc -std=c11 -Wall -Wextra -Werror -pedantic \
            watch-firmware/momo_face_renderer.c \
            watch-firmware/tests/test_momo_face.c \
            -o /tmp/momo_face_test
          /tmp/momo_face_test

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android 35 SDK
        shell: bash
        run: |
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Validate task behavior and persistence
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WatchCompanion-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
